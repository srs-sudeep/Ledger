# Production: optimized images, nginx serves React, persistent Postgres volume.
# Setup: cp .env.prod .env (edit secrets) && docker compose -f docker-compose.prod.yml up -d --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    depends_on:
      db:
        condition: service_healthy
    # API is internal-only; clients reach it via nginx /api/

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT}:80"
    volumes:
      - ./artifacts/apk:/usr/share/nginx/html/downloads:ro

  # Optional: build Android APK (not for running the app — see mobile/README.md)
  # docker compose -f docker-compose.prod.yml --profile mobile-build run --rm mobile-build
  mobile-build:
    profiles: [mobile-build]
    build:
      context: ./mobile
      dockerfile: Dockerfile
      args:
        API_BASE_URL: ${API_BASE_URL}
    volumes:
      - ./mobile/build/app/outputs:/app/build/app/outputs

  portainer:
    image: portainer/portainer-ce:latest
    restart: unless-stopped
    # Home-lab: skip timed setup token so admin can be created after restarts
    command: ["--no-setup-token"]
    ports:
      - "${PORTAINER_PORT}:9000"
      - "${PORTAINER_HTTPS_PORT}:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

volumes:
  pgdata:
    name: ledger_pgdata
  portainer_data:
    name: ledger_portainer_data
